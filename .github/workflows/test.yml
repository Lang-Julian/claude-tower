name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Boot smoke test
        run: |
          TOWER_PORT=7890 node server.js &
          PID=$!
          sleep 2
          curl -sf http://localhost:7890/api/version
          curl -sf http://localhost:7890/api/sessions > /dev/null
          kill $PID
