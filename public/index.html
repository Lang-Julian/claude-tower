<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>claude-tower</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Press+Start+2P&display=swap" />
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/pixel.css" />
  <link rel="stylesheet" href="/cards.css" />
  <link rel="stylesheet" href="/hud.css" />
  <link rel="stylesheet" href="/palette.css" />
  <link rel="stylesheet" href="/states.css" />
  <link rel="stylesheet" href="/onboarding.css" />
  <link rel="stylesheet" href="/help-overlay.css" />
  <link rel="stylesheet" href="/town.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%230085C7'/><circle cx='16' cy='16' r='5' fill='%2300C2FF'/></svg>" />
</head>
<body data-view="town">
  <div id="townVignette" aria-hidden="true"></div>
  <header class="hud" id="hud" data-scrolled="0">
    <div class="hud-brand">
      <span class="hud-brand-mark">claude-tower</span>
      <span class="hud-brand-sub">mission control</span>
    </div>

    <div class="hud-orbits" id="hudOrbits" aria-label="Live session stats">
      <span class="hud-orb-pill" data-key="thinking" data-count="0" title="actively reasoning (Claude is thinking)">
        <span class="orb" data-status="thinking"></span>
        <span class="hud-count" data-stat="thinking">0</span>
        <span class="hud-label">thinking</span>
      </span>
      <span class="hud-orb-pill" data-key="active" data-count="0" title="running a tool / executing">
        <span class="orb" data-status="running"></span>
        <span class="hud-count" data-stat="active">0</span>
        <span class="hud-label">active</span>
      </span>
      <span class="hud-orb-pill" data-key="waiting" data-count="0" title="waiting for input">
        <span class="orb" data-status="needs_input"></span>
        <span class="hud-count" data-stat="waiting">0</span>
        <span class="hud-label">waiting</span>
      </span>
      <span class="hud-orb-pill" data-key="permission" data-count="0" title="needs permission">
        <span class="orb" data-status="needs_permission"></span>
        <span class="hud-count" data-stat="permission">0</span>
        <span class="hud-label">permission</span>
      </span>
      <span class="hud-orb-pill" data-key="idle" data-count="0" title="idle sessions">
        <span class="orb" data-status="idle"></span>
        <span class="hud-count" data-stat="idle">0</span>
        <span class="hud-label">idle</span>
      </span>
    </div>

    <div class="hud-meta topbar-meta">
      <div class="hud-seg view-toggle" role="tablist" aria-label="View">
        <button type="button" id="viewTown" aria-pressed="true">▣ Town</button>
        <button type="button" id="viewCards" aria-pressed="false">▦ Cards</button>
      </div>
      <span id="conn" class="pill pill-muted">connecting…</span>
      <button type="button" id="planPill" class="hud-plan-pill" aria-pressed="false" title="Plan: tokens shown (Max/Pro). Click to switch to USD (API plan).">
        <span class="hud-plan-label">Plan</span>
        <span class="hud-plan-value" data-value="max">MAX</span>
      </button>
      <label class="hud-toggle toggle" title="Telegram push when an agent needs input or permission">
        <input id="notifierToggle" type="checkbox" checked />
        <span>Telegram</span>
      </label>
      <button type="button" id="soundToggle" class="hud-icon-btn icon-btn" aria-pressed="true" title="Sound on (click to mute)">🔊</button>
      <button type="button" id="helpBtn" class="hud-icon-btn" aria-label="Help (press ?)" title="Help &amp; shortcuts (?)">?</button>
      <button type="button" id="cmdBtn" class="hud-icon-btn hud-cmd-btn" title="Command palette (⌘+K)">
        ⌘ <kbd>K</kbd>
      </button>
      <span id="updated" class="pill pill-muted" title="Last snapshot timestamp">—</span>
    </div>
  </header>

  <!-- Town view -->
  <div id="town-wrap" tabindex="-1">
    <div class="town-hud" id="townHud"></div>
    <div class="town-filter" id="townFilter">
      <button class="filter-chip" data-filter="all"       aria-pressed="true">all</button>
      <button class="filter-chip" data-filter="attention" aria-pressed="false">⚔ attention</button>
      <button class="filter-chip" data-filter="active"    aria-pressed="false">⚡ active</button>
      <button class="filter-chip" data-filter="idle"      aria-pressed="false">💤 idle</button>
    </div>
    <main class="town" id="town" aria-label="Town view">
      <div class="town-loading" id="townLoading" aria-hidden="true">PROVISIONING TOWN…</div>
    </main>
    <aside class="quest-log" id="quests"></aside>
  </div>

  <!-- Cards view -->
  <section class="summary" id="summary"></section>
  <main id="grid" class="grid" aria-label="Sessions" aria-busy="true">
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-row sk-sm"></div>
      <div class="skeleton-row sk-lg"></div>
      <div class="skeleton-row sk-md"></div>
      <div class="skeleton-row sk-bar"></div>
      <div class="skeleton-foot"><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    </div>
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-row sk-sm"></div>
      <div class="skeleton-row sk-lg"></div>
      <div class="skeleton-row sk-md"></div>
      <div class="skeleton-row sk-bar"></div>
      <div class="skeleton-foot"><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    </div>
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-row sk-sm"></div>
      <div class="skeleton-row sk-lg"></div>
      <div class="skeleton-row sk-md"></div>
      <div class="skeleton-row sk-bar"></div>
      <div class="skeleton-foot"><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    </div>
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-row sk-sm"></div>
      <div class="skeleton-row sk-lg"></div>
      <div class="skeleton-row sk-md"></div>
      <div class="skeleton-row sk-bar"></div>
      <div class="skeleton-foot"><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    </div>
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-row sk-sm"></div>
      <div class="skeleton-row sk-lg"></div>
      <div class="skeleton-row sk-md"></div>
      <div class="skeleton-row sk-bar"></div>
      <div class="skeleton-foot"><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    </div>
    <div class="skeleton-card" aria-hidden="true">
      <div class="skeleton-row sk-sm"></div>
      <div class="skeleton-row sk-lg"></div>
      <div class="skeleton-row sk-md"></div>
      <div class="skeleton-row sk-bar"></div>
      <div class="skeleton-foot"><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
    </div>
  </main>

  <footer class="footer">
    <span><code id="portInfo">localhost</code> · live · <kbd>⌘K</kbd> palette · <kbd>v</kbd> view · <kbd>a</kbd> approve · <kbd>d</kbd> deny · <kbd>t</kbd> telegram · <kbd>r</kbd> reload · click → iTerm focus</span>
  </footer>

  <template id="cardTpl">
    <article class="card" data-status="" tabindex="0">
      <header>
        <span class="orb status-dot" data-status="" aria-label="status"></span>
        <span class="status-label"></span>
        <span class="age"></span>
      </header>
      <h2 class="title"></h2>
      <p class="prompt"></p>
      <div class="timeline" title=""></div>
      <div class="spark-row">
        <span class="sparkline"></span>
        <svg class="spark-svg" viewBox="0 0 60 16" aria-hidden="true"></svg>
      </div>
      <footer>
        <span class="project"></span>
        <span class="pid"></span>
      </footer>
      <div class="meta-row">
        <span class="pr"></span>
        <span class="permission-mode"></span>
        <span class="git-branch"></span>
      </div>
    </article>
  </template>

  <script src="/a11y.js" type="module"></script>
  <script src="/toast.js" type="module"></script>
  <script src="/storage.js" type="module"></script>
  <script src="/store.js" type="module"></script>
  <script src="/sounds.js" type="module"></script>
  <script src="/particles.js" type="module"></script>
  <script src="/minimap.js" type="module"></script>
  <script src="/help-overlay.js" type="module"></script>
  <script src="/onboarding.js" type="module"></script>
  <script src="/palette.js" type="module"></script>
  <script src="/hud.js" type="module"></script>
  <script src="/app.js" type="module"></script>
  <script src="/pixel.js" type="module"></script>
  <script src="/approvals.js" type="module"></script>
  <script src="/view.js" type="module"></script>
  <script src="/usage.js" type="module"></script>
</body>
</html>
